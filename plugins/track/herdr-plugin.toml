id = "herdr-extras.track"
name = "Track"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Agent activity timeline: one growing line per agent, a node at every state change"
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release"]

[[panes]]
id = "track"
title = "Track"
placement = "split"
command = ["target/release/herdr-track"]

[[panes]]
id = "track-popup"
title = "Track"
placement = "popup"
width = "80%"
height = "80%"
command = ["target/release/herdr-track", "--popup"]

[[actions]]
id = "open"
title = "Agent track (side panel)"
command = ["target/release/herdr-track", "open", "split"]

[[actions]]
id = "open-popup"
title = "Agent track (popup)"
command = ["target/release/herdr-track", "open", "popup"]

# Recorder: every agent lifecycle event appends to the history log the panel loads on open.
[[events]]
on = "pane.created"
command = ["target/release/herdr-track", "record"]

[[events]]
on = "pane.agent_detected"
command = ["target/release/herdr-track", "record"]

[[events]]
on = "pane.agent_status_changed"
command = ["target/release/herdr-track", "record"]

[[events]]
on = "pane.closed"
command = ["target/release/herdr-track", "record"]

[[events]]
on = "pane.exited"
command = ["target/release/herdr-track", "record"]
