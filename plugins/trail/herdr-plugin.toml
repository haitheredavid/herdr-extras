id = "herdr-trail"
name = "Trail"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Agent activity timeline for herdr: state, context and cost per agent, and a step-through session timeline"
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release", "--locked", "--target-dir", "target"]

[[panes]]
id = "trail"
title = "Trail"
placement = "split"
command = ["target/release/herdr-trail"]

[[panes]]
id = "trail-popup"
title = "Trail"
placement = "popup"
width = "80%"
height = "80%"
command = ["target/release/herdr-trail", "--popup"]

[[actions]]
id = "open"
title = "Agent trail (band)"
command = ["target/release/herdr-trail", "open", "split"]

[[actions]]
id = "open-popup"
title = "Agent trail (popup)"
command = ["target/release/herdr-trail", "open", "popup"]

# Recorder: every agent lifecycle event appends to the history log the panel loads on open.
[[events]]
on = "pane.created"
command = ["target/release/herdr-trail", "record"]

[[events]]
on = "pane.agent_detected"
command = ["target/release/herdr-trail", "record"]

[[events]]
on = "pane.agent_status_changed"
command = ["target/release/herdr-trail", "record"]

[[events]]
on = "pane.closed"
command = ["target/release/herdr-trail", "record"]

[[events]]
on = "pane.exited"
command = ["target/release/herdr-trail", "record"]

# Pin: the band follows focus into whichever workspace/tab you switch to.
[[events]]
on = "workspace.focused"
command = ["target/release/herdr-trail", "follow"]

[[events]]
on = "tab.focused"
command = ["target/release/herdr-trail", "follow"]
